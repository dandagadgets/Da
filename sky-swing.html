<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Swing</title>
<meta name="description" content="Swing from ring to ring across a sunset canyon. Hold to grab, release to fly, and see how far you can go before you hit the sea.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6e6;
    --ink:#2c2233;
    --gold:#f6c945;
    --accent:#ff6b5b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#0d1b2a;
    font-family:'Fredoka',system-ui,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #game{
    position:fixed;
    inset:0;
    display:block;
  }
  .hud{
    position:fixed;
    top:calc(env(safe-area-inset-top, 0px) + 14px);
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    padding:0 16px;
    pointer-events:none;
  }
  .pill{
    background:var(--cream);
    border-radius:999px;
    padding:8px 16px;
    box-shadow:0 6px 16px rgba(13,27,42,.25);
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
  }
  .pill .label{
    font-size:.62rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:#8a7f68;
  }
  .pill .value{
    font-size:1.05rem;
    font-variant-numeric:tabular-nums;
  }
  .pill.best .value{color:#c98a1c;}
  .hint{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);
    transform:translateX(-50%);
    background:var(--cream);
    border-radius:999px;
    padding:12px 22px;
    font-weight:600;
    font-size:.85rem;
    letter-spacing:.03em;
    box-shadow:0 8px 20px rgba(13,27,42,.3);
    white-space:nowrap;
    transition:opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }
  .hint.hidden{opacity:0;transform:translate(-50%,10px);}
  .hint .dot{color:var(--accent);}

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(13,20,34,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .overlay[hidden]{display:none;}
  .card{
    background:var(--cream);
    border-radius:24px;
    padding:30px 28px;
    max-width:320px;
    width:100%;
    text-align:center;
    box-shadow:0 24px 50px rgba(0,0,0,.4);
  }
  .card h2{
    margin:0 0 4px;
    font-size:1.6rem;
    color:var(--accent);
  }
  .card .newbest{
    display:inline-block;
    margin:4px 0 14px;
    background:var(--gold);
    color:#5a3c00;
    font-size:.75rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:4px 12px;
    border-radius:999px;
  }
  .card .row{
    display:flex;
    justify-content:space-between;
    padding:10px 4px;
    border-top:1px solid rgba(44,34,51,.1);
    font-weight:600;
  }
  .card .row:first-of-type{border-top:none;margin-top:10px;}
  .card .row .val{font-variant-numeric:tabular-nums;}
  .card button{
    margin-top:18px;
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:.95rem;
    letter-spacing:.03em;
    padding:14px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(255,107,91,.4);
  }
  .card button:active{transform:scale(.97);}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="pill dist">
    <span class="label">Dist</span>
    <span class="value" id="distVal">0m</span>
  </div>
  <div class="pill best">
    <span class="label">Best</span>
    <span class="value" id="bestVal">0m</span>
  </div>
</div>

<div class="hint" id="hint">HOLD TO GRAB <span class="dot">&bull;</span> RELEASE TO FLY</div>

<div class="overlay" id="gameOver" hidden>
  <div class="card">
    <h2>Splash!</h2>
    <div id="newBestTag" class="newbest" hidden>New Best!</div>
    <div class="row"><span>Distance</span><span class="val" id="finalDist">0m</span></div>
    <div class="row"><span>Best</span><span class="val" id="finalBest">0m</span></div>
    <button id="retryBtn">Swing Again</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const distVal = document.getElementById('distVal');
  const bestVal = document.getElementById('bestVal');
  const hint = document.getElementById('hint');
  const gameOverPanel = document.getElementById('gameOver');
  const finalDist = document.getElementById('finalDist');
  const finalBest = document.getElementById('finalBest');
  const newBestTag = document.getElementById('newBestTag');
  const retryBtn = document.getElementById('retryBtn');

  const G = 2200;
  const MAX_ROPE = 230;
  const MIN_ROPE = 55;
  const CHAR_R = 18;
  const RING_OUTER = 21;
  const RING_INNER = 10;
  const PPM = 16;
  const WATER_Y = 900;
  const START_X = 60;

  let viewW = 0, viewH = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.round(viewW * DPR);
    canvas.height = Math.round(viewH * DPR);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function hash(n){ const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); }

  function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

  let best = Number(safeGet('skySwingBest')) || 0;
  bestVal.textContent = best + 'm';

  let character, camera, rings, lastRingX, lastRingY;
  let attached, anchor, ropeLen, theta, omega;
  let holding, state, maxDist, firstGrabDone;
  let particles, trail;

  function spawnRing(){
    const spacing = 150 + Math.random() * 110;
    const x = lastRingX + spacing;
    let y = lastRingY + (Math.random() * 170 - 85);
    y = clamp(y, 70, WATER_Y - 170);
    rings.push({ x, y, used: false });
    lastRingX = x;
    lastRingY = y;
  }

  function resetGame(){
    character = { x: START_X, y: -30, vx: 250, vy: 0 };
    attached = false;
    anchor = null;
    ropeLen = 0;
    theta = 0;
    omega = 0;
    rings = [];
    lastRingX = 260;
    lastRingY = 120;
    rings.push({ x: 280, y: 130, used: false });
    for (let i = 0; i < 6; i++) spawnRing();
    camera = { x: 0, y: 0 };
    holding = false;
    maxDist = 0;
    state = 'playing';
    firstGrabDone = false;
    particles = [];
    trail = [];
    hint.classList.remove('hidden');
    gameOverPanel.hidden = true;
    distVal.textContent = '0m';
  }

  function spawnGrabBurst(x, y){
    for (let i = 0; i < 12; i++){
      const ang = Math.random() * Math.PI * 2;
      const spd = 50 + Math.random() * 100;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 30,
        life: 0.45 + Math.random() * 0.3,
        maxLife: 0.75,
        size: 2 + Math.random() * 2.2
      });
    }
  }

  function tryGrab(){
    let bestRing = null, bestD = Infinity;
    for (const r of rings){
      if (r.used) continue;
      if (r.x < character.x - 20) continue;
      const d = Math.hypot(r.x - character.x, r.y - character.y);
      if (d <= MAX_ROPE && d < bestD){ bestD = d; bestRing = r; }
    }
    if (bestRing){
      anchor = bestRing;
      bestRing.used = true;
      attached = true;
      ropeLen = Math.max(MIN_ROPE, bestD);
      theta = Math.atan2(character.x - anchor.x, character.y - anchor.y);
      const ct = Math.cos(theta), st = Math.sin(theta);
      omega = (character.vx * ct - character.vy * st) / ropeLen;
      spawnGrabBurst(anchor.x, anchor.y);
      if (!firstGrabDone){ firstGrabDone = true; hint.classList.add('hidden'); }
    }
  }

  function release(){
    if (!attached) return;
    const ct = Math.cos(theta), st = Math.sin(theta);
    character.vx = ropeLen * omega * ct;
    character.vy = -ropeLen * omega * st;
    attached = false;
    anchor = null;
  }

  function crash(){
    state = 'gameover';
    const isNew = maxDist > best;
    if (isNew){ best = maxDist; safeSet('skySwingBest', String(best)); }
    finalDist.textContent = maxDist + 'm';
    finalBest.textContent = best + 'm';
    bestVal.textContent = best + 'm';
    newBestTag.hidden = !isNew;
    gameOverPanel.hidden = false;
  }

  function updateParticles(dt){
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.vy += 260 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function updateTrail(){
    const speed = attached ? Math.abs(omega * ropeLen) : Math.hypot(character.vx, character.vy);
    if (speed > 160){
      trail.push({ x: character.x, y: character.y });
      if (trail.length > 7) trail.shift();
    } else if (trail.length){
      trail.shift();
    }
  }

  function update(dt){
    if (holding && !attached) tryGrab();

    if (attached){
      const alpha = -(G / ropeLen) * Math.sin(theta);
      omega += alpha * dt;
      omega *= 0.999;
      theta += omega * dt;
      character.x = anchor.x + ropeLen * Math.sin(theta);
      character.y = anchor.y + ropeLen * Math.cos(theta);
    } else {
      character.vy += G * dt;
      character.vx = clamp(character.vx, -50, 620);
      character.x += character.vx * dt;
      character.y += character.vy * dt;
    }

    updateTrail();
    updateParticles(dt);

    while (lastRingX < character.x + viewW * 1.6) spawnRing();

    const dist = Math.max(0, Math.floor((character.x - START_X) / PPM));
    if (dist > maxDist){
      maxDist = dist;
      distVal.textContent = maxDist + 'm';
    }

    camera.x = character.x - viewW * 0.32;
    camera.y = clamp(character.y - viewH * 0.42, -400, WATER_Y - viewH * 0.55);

    if (character.y > WATER_Y + 10) crash();
  }

  function drawSky(){
    const g = ctx.createLinearGradient(0, 0, 0, viewH);
    g.addColorStop(0, '#bfe7dd');
    g.addColorStop(0.45, '#e9d8b4');
    g.addColorStop(1, '#f3b78f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);
  }

  function drawSun(){
    const sx = viewW * 0.78, sy = viewH * 0.16;
    const glow = ctx.createRadialGradient(sx, sy, 4, sx, sy, 150);
    glow.addColorStop(0, 'rgba(255,241,196,0.85)');
    glow.addColorStop(1, 'rgba(255,241,196,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, 150, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx, sy, 32, 0, Math.PI * 2);
    ctx.fillStyle = '#fff4d4';
    ctx.fill();
  }

  function drawClouds(t){
    const factor = 0.25;
    const spacing = 340;
    const drift = t * 0.01;
    const start = Math.floor((camera.x * factor - drift - 220) / spacing) * spacing;
    const puffs = [[0, 0, 74, 24], [46, 9, 48, 18], [-46, 11, 42, 16], [12, -11, 34, 14]];
    for (let wx = start; wx < camera.x * factor + drift + viewW + 220; wx += spacing){
      const sx = wx - camera.x * factor + drift;
      const sy = 60 + 70 * hash(wx * 0.013);
      const op = 0.45 + 0.3 * hash(wx * 0.031);
      puffs.forEach(([ox, oy, rx, ry]) => {
        const g = ctx.createRadialGradient(sx + ox, sy + oy, 2, sx + ox, sy + oy, Math.max(rx, ry));
        g.addColorStop(0, `rgba(255,246,232,${op})`);
        g.addColorStop(1, 'rgba(255,246,232,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(sx + ox, sy + oy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }

  function drawMountainLayer(parallax, baseY, amp, colorTop, colorBottom, rimColor, seed){
    const seg = 70;
    const start = Math.floor((camera.x * parallax) / seg) * seg - seg;
    const end = camera.x * parallax + viewW + seg * 2;
    const pts = [];
    for (let wx = start; wx < end; wx += seg){
      const h = amp * (0.4 + 0.6 * hash(wx * 0.02 + seed));
      pts.push({ sx: wx - camera.x * parallax, sy: (baseY - camera.y) - h });
    }
    if (pts.length < 2) return;

    ctx.beginPath();
    ctx.moveTo(pts[0].sx, viewH + 10);
    pts.forEach(p => ctx.lineTo(p.sx, p.sy));
    ctx.lineTo(pts[pts.length - 1].sx, viewH + 10);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, baseY - camera.y - amp, 0, baseY - camera.y);
    g.addColorStop(0, colorTop);
    g.addColorStop(1, colorBottom);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[0].sx, pts[0].sy);
    pts.forEach(p => ctx.lineTo(p.sx, p.sy));
    ctx.strokeStyle = rimColor;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawWater(t){
    const sy = WATER_Y - camera.y;
    if (sy > viewH) return;
    const g = ctx.createLinearGradient(0, sy, 0, viewH);
    g.addColorStop(0, '#2a8b8f');
    g.addColorStop(0.4, '#166171');
    g.addColorStop(1, '#081f30');
    ctx.fillStyle = g;
    ctx.fillRect(0, sy, viewW, viewH - sy);

    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= viewW; x += 20){
      const y = sy + Math.sin(x * 0.05 + t * 0.003) * 2;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    const shimmerX = ((t * 0.05) % (viewW + 300)) - 150;
    const sg = ctx.createLinearGradient(shimmerX - 90, 0, shimmerX + 90, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.14)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, sy, viewW, viewH - sy);
  }

  function drawRings(t){
    const mid = (RING_OUTER + RING_INNER) / 2;
    const bandWidth = RING_OUTER - RING_INNER;
    for (const r of rings){
      const bob = r.used ? 0 : Math.sin(t * 0.003 + r.x * 0.01) * 4;
      const sx = r.x - camera.x;
      const sy = r.y - camera.y + bob;
      if (sx < -50 || sx > viewW + 50) continue;

      if (!r.used){
        const glow = ctx.createRadialGradient(sx, sy, 4, sx, sy, RING_OUTER * 2.2);
        glow.addColorStop(0, 'rgba(255,214,110,0.35)');
        glow.addColorStop(1, 'rgba(255,214,110,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, sy, RING_OUTER * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.globalAlpha = r.used ? 0.4 : 1;

      ctx.beginPath();
      ctx.arc(sx + 2, sy + 3, mid, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = bandWidth;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(sx, sy, mid, 0, Math.PI * 2);
      const rg = ctx.createLinearGradient(sx - RING_OUTER, sy - RING_OUTER, sx + RING_OUTER, sy + RING_OUTER);
      if (r.used){
        rg.addColorStop(0, '#b9ab84');
        rg.addColorStop(1, '#7d7458');
      } else {
        rg.addColorStop(0, '#ffe9a8');
        rg.addColorStop(0.5, '#f5b436');
        rg.addColorStop(1, '#c8791a');
      }
      ctx.strokeStyle = rg;
      ctx.lineWidth = bandWidth;
      ctx.stroke();

      if (!r.used){
        ctx.beginPath();
        ctx.arc(sx, sy, mid, Math.PI * 1.1, Math.PI * 1.6);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawTrail(){
    for (let i = 0; i < trail.length; i++){
      const p = trail[i];
      const sx = p.x - camera.x, sy = p.y - camera.y;
      const frac = (i + 1) / trail.length;
      ctx.globalAlpha = frac * 0.22;
      ctx.beginPath();
      ctx.arc(sx, sy, CHAR_R * (0.45 + 0.4 * frac), 0, Math.PI * 2);
      ctx.fillStyle = '#f6a623';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles(){
    for (const p of particles){
      const sx = p.x - camera.x, sy = p.y - camera.y;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = '#ffdd88';
      ctx.beginPath();
      ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRope(){
    if (!attached) return;
    const sx = character.x - camera.x;
    const sy = character.y - camera.y;
    const ax = anchor.x - camera.x;
    const ay = anchor.y - camera.y;
    const mx = (sx + ax) / 2 + (sy - ay) * 0.03;
    const my = (sy + ay) / 2 + (ax - sx) * 0.03;
    ctx.strokeStyle = 'rgba(255,250,240,0.9)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(mx, my, sx, sy);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ax, ay, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  function drawCharacter(t){
    const sx = character.x - camera.x;
    const sy = character.y - camera.y;
    let rot;
    if (attached){
      rot = clamp(theta * 0.6, -1, 1);
    } else {
      rot = clamp(Math.atan2(character.vy, character.vx) * 0.25, -0.6, 0.6);
    }
    const dir = character.vx >= 0 ? 1 : -1;

    ctx.save();
    ctx.translate(sx, sy);

    // soft ground-independent shadow, always beneath
    ctx.beginPath();
    ctx.ellipse(3, CHAR_R * 0.95, CHAR_R * 0.9, CHAR_R * 0.32, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(15,15,25,0.16)';
    ctx.fill();

    ctx.rotate(rot);

    // cape
    const flutter = Math.sin(t * 0.012 + character.x * 0.01) * 6;
    ctx.beginPath();
    ctx.moveTo(-dir * 6, -4);
    ctx.quadraticCurveTo(-dir * 26, 4 + flutter, -dir * 16, 24 + flutter * 0.6);
    ctx.quadraticCurveTo(-dir * 10, 10, -dir * 3, 6);
    ctx.closePath();
    const capeG = ctx.createLinearGradient(-dir * 26, 0, -dir * 3, 20);
    capeG.addColorStop(0, '#ff8a72');
    capeG.addColorStop(1, '#e6483a');
    ctx.fillStyle = capeG;
    ctx.fill();

    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, CHAR_R * 0.98, CHAR_R * 1.06, 0, 0, Math.PI * 2);
    const bodyG = ctx.createRadialGradient(-CHAR_R * 0.35, -CHAR_R * 0.4, 2, 0, 0, CHAR_R * 1.3);
    bodyG.addColorStop(0, '#ffe17a');
    bodyG.addColorStop(0.55, '#f9b737');
    bodyG.addColorStop(1, '#e28c15');
    ctx.fillStyle = bodyG;
    ctx.fill();

    // rim light
    ctx.beginPath();
    ctx.ellipse(0, 0, CHAR_R * 0.98, CHAR_R * 1.06, 0, Math.PI * 1.1, Math.PI * 1.75);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // belly
    ctx.beginPath();
    ctx.ellipse(0, CHAR_R * 0.28, CHAR_R * 0.58, CHAR_R * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fff3d6';
    ctx.fill();

    // ears
    [-1, 1].forEach((side) => {
      ctx.beginPath();
      ctx.ellipse(side * CHAR_R * 0.62, -CHAR_R * 0.85, 6.5, 8.5, side * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#f2a02a';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(side * CHAR_R * 0.62, -CHAR_R * 0.8, 3.2, 4.6, side * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd9a0';
      ctx.fill();
    });

    // blush
    ctx.fillStyle = 'rgba(255,120,110,0.45)';
    ctx.beginPath();
    ctx.ellipse(-CHAR_R * 0.55, CHAR_R * 0.12, 4.2, 2.6, 0, 0, Math.PI * 2);
    ctx.ellipse(CHAR_R * 0.55, CHAR_R * 0.12, 4.2, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    const lookX = dir * 1.6;
    [-1, 1].forEach((side) => {
      ctx.beginPath();
      ctx.ellipse(side * CHAR_R * 0.36, -CHAR_R * 0.08, 4.4, 5.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(side * CHAR_R * 0.36 + lookX, -CHAR_R * 0.04, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = '#2c2233';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(side * CHAR_R * 0.36 + lookX + 0.9, -CHAR_R * 0.18, 0.9, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    });

    // smile
    ctx.beginPath();
    ctx.arc(0, CHAR_R * 0.05, CHAR_R * 0.32, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = '#8a4a12';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.restore();
  }

  function render(t){
    ctx.clearRect(0, 0, viewW, viewH);
    drawSky();
    drawSun();
    drawClouds(t);
    drawMountainLayer(0.45, WATER_Y + 60, 220, '#4a8f96', '#2c5f68', 'rgba(255,214,153,0.5)', 1.7);
    drawMountainLayer(0.65, WATER_Y + 20, 260, '#356e77', '#1f4a52', 'rgba(255,200,140,0.35)', 4.3);
    drawMountainLayer(0.85, WATER_Y - 10, 200, '#234f58', '#163840', 'rgba(255,190,130,0.25)', 8.1);
    drawWater(t);
    drawRings(t);
    drawTrail();
    drawParticles();
    drawRope();
    drawCharacter(t);
  }

  let lastT = null;
  function frame(t){
    if (lastT === null) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 0.032);
    lastT = t;
    if (state === 'playing') update(dt);
    render(t);
    requestAnimationFrame(frame);
  }

  function pointerDown(e){
    e.preventDefault();
    if (state === 'playing'){
      holding = true;
      tryGrab();
    } else if (state === 'gameover'){
      resetGame();
    }
  }
  function pointerUp(){
    holding = false;
    release();
  }

  canvas.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space'){
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'playing'){ holding = true; tryGrab(); }
      else if (state === 'gameover'){ resetGame(); }
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space'){
      e.preventDefault();
      holding = false;
      release();
    }
  });

  retryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    resetGame();
  });

  resetGame();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
