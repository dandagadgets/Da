<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arcade Promo Edits</title>
<meta name="description" content="Six promo edits for tryarcade.com. Pick one with ?edit=1 to ?edit=6.">
<link rel="icon" href="data:,">
<style>
  @font-face{font-family:'Rubik';src:url(fonts/rubik-latin.woff2) format('woff2');font-weight:300 900;font-display:block;}
  @font-face{font-family:'Inter';src:url(fonts/inter-latin.woff2) format('woff2');font-weight:100 900;font-display:block;}
  @font-face{font-family:'Caveat';src:url(fonts/caveat-latin.woff2) format('woff2');font-weight:400 700;font-display:block;}
  :root{--bg:#0b0615;--v:#8d4ff9;--v-hi:#a676fa;--v-lo:#6b3eba;--v-deep:#573494;--gold:#f2c907;--tag:#251d30;--discord:#5865f2;--muted:#a2a0ac;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#000;color:#fff;font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  body{display:flex;align-items:center;justify-content:center;}
  .stage{position:relative;overflow:hidden;background:var(--bg);cursor:pointer;}
  .stage.v{width:min(100vw,56.25vh);aspect-ratio:9/16;font-size:calc(min(100vw,56.25vh) / 36);}
  .stage.h{width:min(100vw,177.78vh);aspect-ratio:16/9;font-size:calc(min(100vw,177.78vh) / 64);}
  #cam{position:absolute;inset:0;transform-origin:50% 50%;}
  .scene{position:absolute;inset:0;display:none;overflow:hidden;}
  .abs{position:absolute;}
  .fill{position:absolute;inset:0;}
  .row{position:absolute;left:0;right:0;display:flex;justify-content:center;text-align:center;}
  .row > *{will-change:transform,opacity;}
  .fx{opacity:0;will-change:opacity,transform;}
  .d{font-family:'Rubik',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;}
  .shadow{text-shadow:0 .06em .5em rgba(5,2,15,.55);}
  .hl{display:inline-block;background:var(--v);color:#fff;padding:.06em .22em .02em;border-radius:.14em;box-shadow:0 .2em .8em rgba(141,79,249,.55);}
  .mask{overflow:hidden;display:block;}
  .mask > span{display:block;will-change:transform;}
  img{display:block;}
  .bg-dark{background:radial-gradient(70% 45% at 50% 100%, rgba(141,79,249,.35), transparent 70%),var(--bg);}
  .bg-banner{background:radial-gradient(65% 42% at 50% 92%, #8230d9 0%, rgba(130,48,217,0) 75%),radial-gradient(80% 60% at 15% 0%, #1b0a47, transparent 70%),linear-gradient(180deg,#22104f 0%,#391777 55%,#43198a 100%);}
  .bg-img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;}
  .shade{position:absolute;inset:0;}
  /* game cards */
  .gc{position:absolute;border-radius:1.1em;overflow:hidden;background:#140d22;box-shadow:0 1.6em 4em rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);}
  .gc img{width:100%;height:100%;object-fit:cover;}
  .gtitle{font-family:'Rubik',sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.05;}
  .meta{display:flex;align-items:center;gap:.45em;color:#e9e6f2;font-weight:600;}
  .meta svg{width:1.1em;height:1.1em;fill:currentColor;}
  .stars{display:inline-flex;gap:.12em;}
  .stars svg{width:1em;height:1em;}
  /* 3D wall */
  .wallwrap{position:absolute;inset:0;perspective:70em;overflow:hidden;}
  .wall{position:absolute;left:50%;top:50%;}
  .wall .col{position:absolute;top:0;}
  .wall img{position:absolute;left:0;border-radius:.8em;object-fit:cover;box-shadow:0 .8em 2em rgba(0,0,0,.5);}
  /* UI bits */
  .pill{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-family:'Rubik',sans-serif;font-weight:900;text-transform:uppercase;border-radius:.6em;padding:.62em 1.15em;white-space:nowrap;position:relative;overflow:hidden;}
  .pill.white{background:#fff;color:#0b0615;}
  .pill.violet{background:var(--v);color:#fff;}
  .pill.discord{background:var(--discord);color:#fff;font-family:'Inter',sans-serif;font-weight:700;text-transform:none;}
  .pill svg{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .pill .sheen{position:absolute;top:-20%;bottom:-20%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);}
  .glass{background:rgba(30,22,48,.9);border:1px solid rgba(255,255,255,.14);box-shadow:0 1.5em 4em rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(.6em);}
  .pbox{position:absolute;border-radius:1.2em;padding:1.1em 1.2em 1.1em 1.3em;display:flex;align-items:flex-end;gap:.8em;}
  .ptxt{flex:1;font-size:1.45em;line-height:1.35;font-weight:500;min-height:2.7em;}
  .ph{color:#8d86a0;}
  .caret{display:inline-block;width:.08em;height:1.05em;background:var(--v-hi);vertical-align:-.15em;margin-left:.04em;}
  .send{width:2.9em;height:2.9em;border-radius:50%;background:#3a2f52;display:flex;align-items:center;justify-content:center;flex:none;}
  .send.ready{background:var(--v);box-shadow:0 0 1.4em rgba(141,79,249,.7);}
  .send svg{width:1.4em;height:1.4em;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .tagline{font-weight:600;color:#ece8f6;line-height:1.35;}
  .hand{font-family:'Caveat',cursive;font-weight:700;color:#c7a6ff;line-height:.9;}
  /* podium */
  .pod{position:absolute;display:flex;align-items:flex-end;}
  .blk{position:relative;overflow:visible;}
  .blk .clip{position:absolute;left:0;right:0;bottom:0;overflow:hidden;}
  .blk .body{position:absolute;left:0;right:0;bottom:0;}
  .blk .top{position:absolute;left:0;right:0;top:0;height:2.2em;}
  .blk .front{position:absolute;left:0;right:0;top:2.2em;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;}
  .blk .num{font-family:'Rubik',sans-serif;font-weight:900;font-size:6.2em;line-height:.9;color:#fff;text-shadow:0 .03em 0 #e6dcff,0 .06em 0 #c6b3f7,0 .09em 0 #a58ae8,0 .15em .25em rgba(20,6,50,.45);}
  .blk .prize{font-family:'Rubik',sans-serif;font-weight:800;font-size:1.75em;color:#fff;letter-spacing:.01em;white-space:nowrap;}
  .b1 .top{background:#a676fa;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);} .b1 .front{background:#8d4ff9;}
  .b2 .top{background:#9861fa;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);} .b2 .front{background:#6b3eba;}
  .b3 .top{background:#7945d3;clip-path:polygon(0 0,86% 0,100% 100%,0 100%);} .b3 .front{background:#573494;}
  .b1 .num{font-size:7.4em;}
  /* leaderboard */
  .lb{position:absolute;overflow:hidden;}
  .lrow{position:absolute;left:0;right:0;height:4.2em;border-radius:1em;background:#191126;display:flex;align-items:center;gap:1em;padding:0 1.2em;font-weight:700;font-size:1em;}
  .lrow .rk{width:2.6em;color:var(--muted);font-family:'Rubik',sans-serif;font-weight:800;font-size:1.25em;}
  .lrow .nm{flex:1;font-size:1.3em;}
  .lrow .pts{color:var(--muted);font-size:1.15em;}
  .lrow.you{background:linear-gradient(90deg,#8d4ff9,#6b3eba);box-shadow:0 0 2em rgba(141,79,249,.6);}
  .lrow.you .rk,.lrow.you .pts{color:#fff;}
  .av{width:2.6em;height:2.6em;border-radius:50%;flex:none;}
  .toast{position:absolute;border-radius:.8em;padding:.6em 1em;font-weight:800;font-family:'Rubik',sans-serif;display:flex;align-items:center;gap:.5em;white-space:nowrap;}
  .quest{position:absolute;border-radius:1.2em;padding:1.2em 1.3em;}
  .qi{display:flex;align-items:center;gap:.8em;font-size:1.35em;font-weight:600;padding:.45em 0;}
  .qi .box{width:1.5em;height:1.5em;border-radius:.4em;border:.14em solid #5c4f78;display:flex;align-items:center;justify-content:center;flex:none;}
  .qi .box.on{background:var(--v);border-color:var(--v);}
  .qi .box svg{width:1em;height:1em;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;}
  .qi .xp{margin-left:auto;color:var(--v-hi);font-family:'Rubik',sans-serif;font-weight:800;}
  .dcard{position:absolute;background:#fff;color:#14101c;border-radius:1.3em;overflow:hidden;}
  /* overlays */
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #grain{position:absolute;inset:-20%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 45%, transparent 58%, rgba(0,0,0,.42));}
  #flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;}
  .progress{position:absolute;left:0;bottom:0;height:.2em;background:var(--v);width:0;z-index:50;opacity:.9;}
  .capture .progress{display:none;}
  /* spooky season */
  .bg-night{background:radial-gradient(55% 35% at 72% 8%, rgba(150,140,255,.32), transparent 70%),linear-gradient(180deg,#1b1745 0%,#100c28 55%,#07050f 100%);}
  .slime{color:#0b0615;background:#7dee3f;box-shadow:0 0 1.2em rgba(125,238,63,.6),0 .2em .8em rgba(0,0,0,.4);}
  .glow-g{text-shadow:0 0 .35em rgba(125,238,63,.75),0 .06em .4em rgba(5,2,15,.6);}
  .badge{display:inline-flex;align-items:center;gap:.5em;font-family:'Rubik',sans-serif;font-weight:800;text-transform:uppercase;border-radius:.5em;padding:.4em .75em;}
  .medal{width:2.6em;height:2.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Rubik',sans-serif;font-weight:900;font-size:1em;color:#3a2600;box-shadow:inset 0 -.2em 0 rgba(0,0,0,.18),0 .3em .8em rgba(0,0,0,.35);}
  /* your mold */
  .moldcard{position:absolute;overflow:hidden;background:radial-gradient(80% 50% at 30% 20%, rgba(255,255,255,.14), transparent 60%),radial-gradient(70% 60% at 80% 90%, rgba(20,30,90,.45), transparent 70%),linear-gradient(160deg,#3d60c4,#2a47a7 55%,#22409e);}
  .tabs{position:absolute;display:flex;gap:2em;font-size:1.55em;font-weight:500;color:#b9b4c6;}
  .tabs .on{color:#fff;position:relative;}
  .tabs .on::after{content:'';position:absolute;left:-.4em;right:-.4em;bottom:-.55em;height:.14em;border-radius:.1em;background:#8d4ff9;}
  .chips{position:absolute;display:flex;gap:.6em;}
  .chip{flex:1;text-align:center;border-radius:.6em;background:#181322;color:#cfcadb;font-weight:700;font-size:1.25em;padding:.6em 0;}
  .chip.on{background:#2f2a38;color:#fff;}
  .sw{position:absolute;border-radius:1em;background:#181322;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:.8em;}
  .sw img{position:absolute;left:50%;top:.8em;height:72%;transform:translateX(-50%);}
  .sw .nm{font-weight:600;font-size:1.2em;}
  .sw.on{box-shadow:0 0 0 .2em #8d4ff9,0 0 1.5em rgba(141,79,249,.6);}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="mb" x="-20%" y="-5%" width="140%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbB" stdDeviation="0 0"/></filter>
  </defs>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M1.5 20.5c0-4 3.4-6.6 7.5-6.6s7.5 2.6 7.5 6.6z"/><circle cx="17.5" cy="7" r="3"/><path d="M16 13.2c3.7-.6 7 1.6 7 5.6v1.7h-5c0-2.9-.6-5.3-2-7.3z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.1l-6.1 3.5 1.5-6.8L2.2 9.2l6.9-.7z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17L17 7M8.5 7H17v8.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-discord" viewBox="0 0 24 24"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></symbol>

<div class="stage" id="stage" role="img" aria-label="Arcade promo video">
  <div id="cam"></div>
  <canvas id="fx"></canvas>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="flash"></div>
  <div class="progress" id="progress"></div>

<script>
(() => {
  // Six promo edits for tryarcade.com, built from screenshots of the site (arcade-assets/).
  // Every edit is a pure function of time t (ms), so it plays live or renders frame-by-frame
  // (?capture) with its sound cues exported through AD.events for tools/playabl-ad-audio.js.
  const Q = new URLSearchParams(location.search);
  const EDIT = Math.max(1, Math.min(6, Math.round(+Q.get('edit') || 1)));
  const $ = id => document.getElementById(id);
  const stage = $('stage'), cam = $('cam');
  const capture = Q.has('capture');
  if (capture) document.body.classList.add('capture');

  // ---------- helpers ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const E = {
    out: p => 1 - Math.pow(1 - p, 3), expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
    in: p => p * p * p, inout: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2,
    sine: p => -(Math.cos(Math.PI * p) - 1) / 2,
    back: p => { const c = 1.5; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
    elastic: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI / 3)) + 1,
  };
  const prog = (t, t0, d, e = E.expo) => e(clamp((t - t0) / d));
  const lerp = (a, b, p) => a + (b - a) * p;
  const cache = new WeakMap();
  const setHTML = (el, s) => { if (cache.get(el) !== s){ cache.set(el, s); el.innerHTML = s; } };
  const show = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
  const IMGS = [];
  function h(parent, cls = '', html = '', style = ''){
    const e = document.createElement('div');
    if (cls) e.className = cls; if (html) e.innerHTML = html; if (style) e.style.cssText = style;
    parent.appendChild(e); return e;
  }
  function im(parent, src, cls = '', style = ''){
    const e = new Image(); e.src = src; if (cls) e.className = cls; if (style) e.style.cssText = style;
    e.draggable = false; parent.appendChild(e); IMGS.push(e); return e;
  }
  const icon = (id, cls = '') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
  const A = f => 'arcade-assets/' + f;

  // fades in (and optionally out) with a soft rise + blur
  function fade(el, p, y = 1, blur = .3, extra = ''){
    p = clamp(p);
    el.style.opacity = p;
    el.style.transform = `translate3d(0,${(1 - p) * y}em,0) ${extra}`;
    el.style.filter = p < .999 && blur ? `blur(${(1 - p) * blur}em)` : 'none';
  }
  const win = (t, a, b, d = 500, d2 = 350) => prog(t, a, d, E.out) * (1 - prog(t, b - d2, d2, E.inout));
  // kinetic "slam": drops in big and blurred, lands with a snap
  function slam(el, t, at, {s0 = 1.9, d = 420, rot = 0, base = ''} = {}){
    if (t < at){ el.style.opacity = 0; return 0; }
    const p = prog(t, at, d, E.expo);
    el.style.opacity = clamp((t - at) / 70);
    el.style.transform = `${base} scale(${lerp(s0, 1, p)}) rotate(${rot * (1 - p)}deg)`;
    el.style.filter = p < .97 ? `blur(${(1 - p) * .22}em)` : 'none';
    return p;
  }
  // pops in with overshoot
  function pop(el, t, at, {d = 520, base = '', s0 = .2} = {}){
    if (t < at){ el.style.opacity = 0; return 0; }
    const p = clamp((t - at) / d);
    el.style.opacity = clamp((t - at) / 90);
    el.style.transform = `${base} scale(${lerp(s0, 1, E.back(p))})`;
    return p;
  }
  const maskIn = (span, t, a, d = 700) => { span.style.transform = `translate3d(0,${(1 - prog(t, a, d)) * 112}%,0)`; };
  function keystrokes(text, t0, seed, base = 40, jit = 30){
    const r = rng(seed), out = []; let t = t0;
    for (let i = 1; i <= text.length; i++){ t += base + r() * jit + (text[i - 1] === ' ' ? 22 : 0); out.push({t, s: text.slice(0, i)}); }
    return out;
  }
  const fmtInt = n => Math.round(n).toLocaleString('en-US');
  const euro = n => `${Math.round(n)},00 €`;
  const count = (t, a, d, to, from = 0) => lerp(from, to, prog(t, a, d, E.out));

  // ---------- data from the site ----------
  const GAMES = {
    wrongland: {t: 'WrongLand', p: 198, f: 'wrongland'},
    burger: {t: 'Burger Minute', p: 356, f: 'burger-minute'},
    heist: {t: 'The Heist', p: 159, f: 'the-heist'},
    wanted: {t: 'Wanted dead or alive', p: 820, f: 'wanted'},
    lastman: {t: 'The Last man alive', p: 28, f: 'last-man'},
    lastlight: {t: 'Last Light Evacuation', f: 'last-light'},
    sprouts: {t: 'Sunny Sprouts', f: 'sunny-sprouts'},
    bunker: {t: 'BUNKER SIGNAL: 161.80', p: 36, f: 'bunker-signal'},
  };
  const ALL = Object.keys(GAMES);
  const gsrc = k => A(`game-${GAMES[k].f}.jpg`);
  const RATIO = 624 / 1112;   // thumbnail height / width

  // ---------- shared pieces ----------
  // a tilted wall of game thumbnails, columns drifting in opposite directions
  function makeWall(parent, {cols = 5, cw = 10.5, gap = 1, rx = 26, rz = -14, sc = 1.2, speed = 3.2, seed = 3} = {}){
    const wrap = h(parent, 'wallwrap'), plane = h(wrap, 'wall');
    const chh = cw * RATIO, rowH = chh + gap, N = ALL.length, seqH = N * rowH, W = cols * (cw + gap) - gap;
    plane.style.cssText = `width:${W}em;height:${seqH}em;`;
    const r = rng(seed), colEls = [];
    for (let c = 0; c < cols; c++){
      const col = h(plane, 'col', '', `left:${c * (cw + gap)}em;width:${cw}em;`);
      const off = (c * 3) % N;
      for (let i = 0; i < N * 3; i++) im(col, gsrc(ALL[(i + off) % N]), '', `top:${i * rowH}em;width:${cw}em;height:${chh}em;`);
      colEls.push({col, dir: c % 2 ? 1 : -1, ph: r(), sp: .8 + r() * .4});
    }
    return (t, {boost = 0, rot = 0, scale = 1} = {}) => {
      plane.style.transform = `translate(-50%,-50%) rotateX(${rx}deg) rotateZ(${rz + rot}deg) scale(${sc * scale})`;
      const s = t / 1000 * speed + boost;

      const rows = names.map((n, i) => h(lb, 'lrow', `<div class="rk"></div>${avatarSVG(avs[i % avs.length])}<div class="nm">${n}</div><div class="pts"></div>`));
      const fin = ['NovaBlitz', 'PixelPanda', 'Mango', 'Zyra'].map((n, i) => h(lb, 'lrow', `<div class="rk">#${i + 2}</div>${avatarSVG(avs[i])}<div class="nm">${n}</div><div class="pts">${fmtInt(3925 - i * 25)}</div>`));
      const you = h(lb, 'lrow you', `<div class="rk"></div>${avatarSVG('#fff')}<div class="nm">You</div><div class="pts"></div>`);
      const toasts = [12250, 12750, 13250].map((at, i) => h(h(s.el, 'row', '', 'top:21.2em;'), 'toast fx', `${icon('i-check', '')}<span>Quest complete</span><span style="color:var(--gold)">+${[150, 200, 250][i]}</span>`, 'position:relative;background:#fff;color:#0b0615;font-size:1.5em;box-shadow:0 .5em 1.5em rgba(0,0,0,.4);'));

      const RANK = lt => Math.max(1, Math.round(128 * Math.pow(1 - prog(lt, 0, 1650, E.inout), 1.6)));
      on(s, lt => {
        const r = RANK(lt), pts = Math.round(lerp(1200, 3950, prog(lt, 0, 1650, E.inout)));

          const y = ((i * 4.8 - scroll) % L + L) % L - 4.8;

        fin.forEach((row, i) => { const p = prog(lt, 1520 + i * 60, 380, E.out); row.style.opacity = p; row.style.transform = `translate3d(0,${4.8 * (1 + i) + (1 - p) * 3}em,0)`; });
        toasts.forEach((x, i) => { const at = [250, 750, 1250][i]; fade(x, win(lt, at, at + 480, 160, 140), -1.2, 0, `scale(${.9 + .1 * prog(lt, at, 200, E.back)})`); });
      });
      whips.push({t: 12000, dir: 1});
      ev.push({t: 12000, type: 'cut'});

      [12250, 12750, 13250].forEach(at => ev.push({t: at, type: 'like'}));
    }

    // 6 · end card
    {
      const s = scene(14000, 18000, 'bg-banner');

      on(s, lt => {

      bursts.push({t: DROP + 20, kind: 'confetti', x: 18, y: 66, n: 140, v: 70, spread: 1.2, g: 24, seed: 33, stagger: .1});
    }
    return {DURATION: 18000, groove: G, drop: DROP, bars: 6, transpose: 0, mood: 'hype', events: () => ev, hits, whips, flashes, bursts, ramps: [{a: 13600, b: 14000, k: .9}]};
  }

    return {DURATION: 17000, groove: G, drop: DROP, bars: 6, transpose: 3, mood: 'hype', events: () => ev, hits, whips, flashes, bursts, ramps: [{a: 13650, b: 14000, k: .9}]};

        const lp = prog(t, 16000, 900, E.back); logo.style.opacity = clamp((t - 16000) / 100); logo.style.transform = `scale(${.4 + .6 * lp}) rotate(${(1 - lp) * -140}deg)`;
        const tp = prog(t, 16150, 900, E.elastic); title.style.opacity = clamp((t - 16150) / 80);
        title.style.transform = `translate3d(0,${(1 - tp) * -10}em,0) scale(${1 + Math.sin(t / 400) * .01})`;
        slam(l1, t, 16700, {s0: 1.4});
        const cp = pop(cta, t, 17200); if (cp >= 1) cta.style.transform = `scale(${1 + .03 * Math.sin((t - 17720) / 260)})`;
        sheen.style.left = `${lerp(-50, 150, ((t - 17500) % 1600) / 900)}%`;
        fade(url, prog(t, 17500, 500), .6); fade(ends, prog(t, 17700, 500), .6);
        const bp = prog(t, 17900, 500, E.back); bunny.style.transform = `translate3d(${(1 - bp) * 8}em,0,0) rotate(${-8 + Math.sin(t / 170) * 3}deg)`;
      });
      ev.push({t: DROP, type: 'drop'}, {t: 16150, type: 'rivals'}, {t: 16700, type: 'slam'}, {t: 17200, type: 'tap'}, {t: 17900, type: 'hop'});
      hits.push({t: DROP, k: 1.1}, {t: 16700, k: .4});
      bursts.push({t: DROP + 20, kind: 'confetti', x: 18, y: 66, n: 130, v: 70, spread: 1.2, g: 24, seed: 77, stagger: .1});
    }
    return {DURATION: 20000, groove: G, drop: DROP, bars: 7, transpose: -3, mood: 'hype', events: () => ev, hits, whips, flashes, bursts, ramps: [{a: 15650, b: 16000, k: .85}]};
  }

  // ============ EDIT 6 · Your Mold: make your character yours (9:16) ============
  function edit6(){
    const G = 2000, DROP = 12000;
    const ev = [], hits = [], whips = [], flashes = [], bursts = [];
    // textures: the three from the editor, then the amethyst figure re-tinted for the rest of the palette
    const TEX = [{f: 'clay', n: 'Clay'}, {f: 'bone', n: 'Bone Clay'}, {f: 'amethyst', n: 'Amethyst'},
      {f: 'amethyst', hue: -130}, {f: 'amethyst', hue: 115}, {f: 'amethyst', hue: -55}, {f: 'amethyst', hue: 50}];
    const texFilter = x => x.hue ? `hue-rotate(${x.hue}deg) saturate(1.15)` : 'none';
    // one figure that swaps texture with a squash-and-stretch pop
    function makeFigure(parent, {left, top, w}){
      const wrap = h(parent, 'abs', '', `left:${left}em;top:${top}em;width:${w}em;transform-origin:50% 100%;`);
      const imgs = {}; ['clay', 'bone', 'amethyst'].forEach(f => { imgs[f] = im(wrap, A(`mold-${f}.png`), '', `width:${w}em;display:none;`); });
      h(wrap, 'abs', '', `left:${w * .1}em;right:${w * .1}em;bottom:-.4em;height:1em;border-radius:50%;background:rgba(10,20,60,.35);filter:blur(.3em);z-index:-1;`);
      return (t, swaps) => {
        let k = 0, at = -1e9; swaps.forEach((sw, i) => { if (t >= sw.t){ k = sw.k; at = sw.t; } });
        const x = TEX[k];
        for (const f in imgs){ imgs[f].style.display = f === x.f ? 'block' : 'none'; }
        imgs[x.f].style.filter = texFilter(x);
        const d = (t - at) / 420, sq = d >= 0 && d < 1 ? Math.sin(d * Math.PI * 2) * Math.exp(-d * 3) * .14 : 0;
        wrap.style.transform = `scale(${1 - sq},${1 + sq}) translate3d(0,${Math.sin(t / 500) * .15}em,0)`;
        return k;
      };
    }

    // 1 · hook
    {
      const s = scene(0, 2000, 'bg-dark');
      const card = h(s.el, 'moldcard', '', 'left:3em;top:22em;width:30em;height:32em;border-radius:2em;');
      const fig = makeFigure(card, {left: 9.6, top: 5, w: 10.8});
      const l1 = h(h(s.el, 'row', '', 'top:9.5em;'), 'd shadow', 'Make it', 'font-size:5em;');
      const l2 = h(h(s.el, 'row', '', 'top:14.6em;'), 'd', '<span class="hl">yours.</span>', 'font-size:6em;');
      const swaps = [0, 500, 1000, 1250, 1500, 1750].map((t, i) => ({t, k: [0, 1, 2, 3, 4, 5][i]}));
      on(s, t => { fig(t, swaps); slam(l1, t, -140, {s0: 1.4}); slam(l2, t, 600, {base: 'rotate(-3deg)', s0: 2}); const cp = prog(t, -200, 600, E.back); card.style.transform = `scale(${.9 + .1 * cp})`; });
      ev.push({t: 0, type: 'slam'}, {t: 600, type: 'slam'}, ...swaps.slice(1).map(sw => ({t: sw.t, type: 'flip'})));
      hits.push({t: 0, k: .4}, {t: 600, k: .6});
    }

    // 2 · the editor: Your Mold → Textures
    {
      const s = scene(2000, 8000, 'bg-dark');
      const tabs = h(s.el, 'tabs fx', '<span class="on">Your Mold</span><span>Morph</span><span>Showcase</span>', `left:${2.6 / 1.55}em;top:${6.2 / 1.55}em;`);
      const chips = h(s.el, 'chips fx', '<div class="chip on">Textures</div><div class="chip">Closet</div><div class="chip">Emotes</div>', 'left:2em;top:10.6em;width:32em;');
      const card = h(s.el, 'moldcard', '', 'left:2em;top:15em;width:32em;height:23em;border-radius:1.8em;');
      const fig = makeFigure(card, {left: 11.7, top: 3.9, w: 8.6});
      const label = h(h(s.el, 'row', '', 'top:16.3em;'), 'd', '', 'font-size:1.8em;letter-spacing:.08em;');
      const cats = h(s.el, 'abs fx', ['Clay', 'Stones', 'Elements', 'Fabric'].map((c, i) => `<span class="pill" style="font-family:Inter;text-transform:none;font-weight:600;font-size:1.25em;padding:.5em .9em;border-radius:.6em;background:${i === 0 ? '#2f2a38' : '#181322'};color:${i === 0 ? '#fff' : '#cfcadb'};">${c}</span>`).join(''), 'left:2em;top:39.6em;display:flex;gap:.6em;');
      const track = h(s.el, 'abs', '', 'left:2em;top:43.6em;height:13em;width:120em;');
      const SW = 10.2, SG = .7;
      const sws = TEX.map((x, i) => { const e = h(track, 'sw', `<img src="${A(`mold-${x.f}.png`)}" style="filter:${texFilter(x)}"><div class="nm">${x.n || '&nbsp;'}</div>`, `left:${i * (SW + SG)}em;top:0;width:${SW}em;height:12.6em;`); IMGS.push(e.querySelector('img')); return e; });
      const swaps = [{t: 0, k: 1}, ...[2600, 3600, 4600, 5600, 6100, 6600, 7100].map((t, i) => ({t, k: i}))];
      on(s, lt => {
        const t = lt + 2000;
        fade(tabs, prog(t, 2000, 400), -1, 0); fade(chips, prog(t, 2100, 400), -1, 0); fade(cats, prog(t, 2300, 400), 1, 0);
        const cp = prog(t, 2000, 600, E.back); card.style.transform = `scale(${.9 + .1 * cp})`;
        const k = fig(t, swaps);
        setHTML(label, TEX[k].n || '');
        label.style.opacity = TEX[k].n ? 1 : 0;
        const cur = swaps.filter(sw => t >= sw.t).pop(), sel = t >= 2600 ? cur.k : -1;
        sws.forEach((e, i) => { e.classList.toggle('on', i === sel); const p = prog(t, 2200 + i * 80, 450, E.back); e.style.opacity = clamp((t - 2200 - i * 80) / 100); e.style.transform = `translate3d(0,${(1 - p) * 4}em,0) scale(${i === sel ? 1.04 : 1})`; });
        const scroll = sel <= 1 ? 0 : (sel - 1) * (SW + SG);
        const prev = swaps.filter(sw => t >= sw.t + 0).length > 1 ? swaps[Math.max(0, swaps.indexOf(cur) - 1)] : cur;
        const from = prev.k <= 1 ? 0 : (prev.k - 1) * (SW + SG), sp = prog(t, cur.t, 380, E.expo);
        track.style.transform = `translate3d(${-lerp(from, scroll, sp)}em,0,0)`;
        if (t >= 2600) setHTML(label, TEX[k].n || '');
      });
      whips.push({t: 2000, dir: 1});
      ev.push({t: 2000, type: 'cut'});
      [2600, 3600, 4600, 5600, 6100, 6600, 7100].forEach((at, i) => { ev.push({t: at, type: i < 3 ? 'upgrade' : 'flip'}); hits.push({t: at, k: .25}); bursts.push({t: at + 20, kind: 'confetti', x: 18, y: 27, n: 26, v: 22, spread: 6.2, g: 10, seed: 90 + i, until: 8000}); });
    }

    // 3 · texture families
    {
      const s = scene(8000, 10000, 'bg-banner');
      const words = ['Clay.', 'Stones.', 'Elements.', 'Fabric.'];
      const w = h(h(s.el, 'row', '', 'top:12em;'), 'd shadow', '', 'font-size:7em;');
      const sub = h(h(s.el, 'row', '', 'top:6.6em;'), 'fx', 'Textures', 'font-family:Rubik;font-weight:800;font-size:1.6em;letter-spacing:.25em;color:#d9c8ff;text-transform:uppercase;');
      const clay = im(s.el, A('mold-clay.png'), 'abs', 'left:11.5em;top:23em;width:13em;');
      const cl = im(s.el, A('crew-left.png'), 'abs', 'left:6em;top:25em;width:24em;');
      const cr = im(s.el, A('crew-right.png'), 'abs', 'left:1em;top:28em;width:34em;');
      on(s, lt => {
        const i = Math.min(3, Math.floor(lt / 500)), l2 = lt - i * 500;
        setWord(w, words[i], 7); slam(w, l2, 0, {s0: 1.6, d: 300}); fade(sub, prog(lt, 0, 300), .5, 0);
        const e = [clay, cr, cl, cr][i], p = prog(l2, 0, 420, E.back);
        [clay, cl, cr].forEach(x => show(x, x === e));
        e.style.transform = `translate3d(${(1 - p) * (i % 2 ? 12 : -12)}em,0,0) scale(${.92 + .08 * p})`;
      });
      [8000, 8500, 9000, 9500].forEach((at, i) => { whips.push({t: at, dir: i % 2 ? -1 : 1}); ev.push({t: at, type: 'slam'}); hits.push({t: at, k: .45}); });
    }

    // 4 · build: textures · closet · emotes
    {
      const s = scene(10000, 12000, 'bg-dark');
      const card = h(s.el, 'moldcard', '', 'left:3em;top:22em;width:30em;height:32em;border-radius:2em;');
      const fig = makeFigure(card, {left: 9.6, top: 5, w: 10.8});
      const w = h(h(s.el, 'row', '', 'top:11em;'), 'd shadow', '', 'font-size:6.4em;');
      const words = ['Textures.', 'Closet.', 'Emotes.', 'All yours.'];
      const swaps = []; { let t = 0, step = 250, k = 0; while (t < 1950){ swaps.push({t, k: k++ % TEX.length}); t += step; if (t >= 1000) step = 125; if (t >= 1500) step = 62.5; } }
      on(s, lt => {
        fig(lt, swaps);
        const i = Math.min(3, Math.floor(lt / 500)); setWord(w, words[i], 6.4); slam(w, lt - i * 500, 0, {s0: 1.5, d: 280});
        card.style.transform = `scale(${1 + lt / 2000 * .08})`;
      });
      whips.push({t: 10000, dir: 1});
      [10000, 10500, 11000, 11500].forEach(at => { ev.push({t: at, type: 'slam'}); hits.push({t: at, k: .4}); });
      swaps.forEach(sw => ev.push({t: 10000 + sw.t, type: 'tick'}));
    }

    // 5 · end card
    {
      const s = scene(12000, 16000, 'bg-dark');
      const logo = h(h(s.el, 'row', '', 'top:5.6em;'), '', logoHTML(5.6));
      const l1 = h(h(s.el, 'row', '', 'top:12em;'), 'd shadow', 'Make your', 'font-size:4.6em;');
      const l2 = h(h(s.el, 'row', '', 'top:16.6em;'), 'd', '<span class="hl">mold</span>', 'font-size:6em;');
      const card = h(s.el, 'moldcard', '', 'left:7em;top:24.4em;width:22em;height:17.4em;border-radius:1.8em;');
      const pv = im(card, A('mold-preview.png'), 'abs', 'left:6.6em;top:1.2em;width:8.8em;');
      const cta = h(h(s.el, 'row', '', 'top:43.6em;'), 'pill white', `Customize yours ${icon('i-arrow')}<span class="sheen"></span>`, 'font-size:2.3em;padding:.7em 1.3em;border-radius:.7em;');
      const url = h(h(s.el, 'row', '', 'top:49.6em;'), 'fx', 'tryarcade.com', 'font-size:1.9em;font-weight:700;letter-spacing:.04em;color:#e2d6ff;');
      const sheen = cta.querySelector('.sheen');
      on(s, lt => {
        const t = lt + 12000;
        const lp = prog(t, 12000, 900, E.back); logo.style.opacity = clamp((t - 12000) / 100); logo.style.transform = `scale(${.4 + .6 * lp}) rotate(${(1 - lp) * -140}deg)`;
        slam(l1, t, 12250, {s0: 1.4}); slam(l2, t, 12600, {base: 'rotate(-3deg)', s0: 2});
        const cp = prog(t, 12300, 700, E.back); card.style.opacity = clamp((t - 12300) / 100); card.style.transform = `translate3d(0,${(1 - cp) * 5}em,0)`;
        pv.style.transform = `translate3d(0,${Math.sin(t / 500) * .2}em,0)`;
        const pp = pop(cta, t, 13100); if (pp >= 1) cta.style.transform = `scale(${1 + .03 * Math.sin((t - 13620) / 260)})`;
        sheen.style.left = `${lerp(-50, 150, ((t - 13400) % 1600) / 900)}%`;
        fade(url, prog(t, 13400, 500), .6);
      });
      ev.push({t: DROP, type: 'drop'}, {t: 12250, type: 'slam'}, {t: 12600, type: 'slam'}, {t: 13100, type: 'tap'});
      hits.push({t: DROP, k: 1.1}, {t: 12600, k: .5});
      bursts.push({t: DROP + 20, kind: 'confetti', x: 18, y: 66, n: 130, v: 70, spread: 1.2, g: 24, seed: 88, stagger: .1});
    }
    return {DURATION: 16000, groove: G, drop: DROP, bars: 5, transpose: 2, mood: 'hype', events: () => ev, hits, whips, flashes, bursts, ramps: [{a: 11650, b: 12000, k: .85}]};
  }

  ED = [edit1, edit2, edit3, edit4, edit5, edit6][EDIT - 1]();
  stage.classList.add(ED.H ? 'h' : 'v');
  const SIZE = ED.H ? {width: 1920, height: 1080} : {width: 1080, height: 1920};

  function render(t){
    t = clamp(t, 0, ED.DURATION - 1);
    for (const sc of scenes){
      const live = t >= sc.a && t < sc.b;
      sc.el.style.display = live ? 'block' : 'none';
      if (live) sc.fns.forEach(fn => fn(t - sc.a));
    }
    camera(t); particles(t); grain(t);
    $('progress').style.width = (t / ED.DURATION * 100) + '%';
  }

  // headlines never run off the frame: shrink any that are wider than the safe width
  function fitText(){
    const em = parseFloat(getComputedStyle(stage).fontSize), maxW = (ED.H ? 58 : 32.6) * em;
    scenes.forEach(sc => {
      sc.el.style.display = 'block';
      sc.el.querySelectorAll('.row > .d').forEach(el => {
        el.style.whiteSpace = 'nowrap';
        const w = el.offsetWidth;
        if (w > maxW) el.style.fontSize = (parseFloat(el.style.fontSize) * maxW / w).toFixed(3) + 'em';
      });
      sc.el.style.display = 'none';
    });
  }
  const fontsReady = document.fonts ? Promise.all(['900 1em Rubik', '800 1em Rubik', '600 1em Inter', '700 1em Caveat'].map(f => document.fonts.load(f))).catch(() => {}) : Promise.resolve();
  const imgsReady = Promise.all(IMGS.map(i => i.decode().catch(() => {})));
  const ready = Promise.all([fontsReady, imgsReady]).then(fitText);
  window.AD = {DURATION: ED.DURATION, SIZE, render, ready,
    events: () => ({duration: ED.DURATION, groove: ED.groove, drop: ED.drop, bars: ED.bars, transpose: ED.transpose, mood: ED.mood, events: ED.events().filter(e => e.type).sort((a, b) => a.t - b.t)})};
  if (capture){ ready.then(() => render(0)); return; }
  let start = 0;
  function loop(now){ render((now - start) % ED.DURATION); requestAnimationFrame(loop); }
  stage.addEventListener('click', () => { start = performance.now(); });
  ready.then(() => { start = performance.now(); requestAnimationFrame(loop); });
})();
</script>
</body>
