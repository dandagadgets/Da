<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Stock Tap</title>
<meta name="description" content="A tap-to-trade stock simulator: buy max, sell all, watch the live price zigzag, and unlock riskier tickers as your portfolio grows.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0e;
    --card:#16161d;
    --card2:#1c1c24;
    --border:rgba(255,255,255,0.07);
    --text:#f5f5f7;
    --muted:#83838f;
    --green:#22d47a;
    --green-dim:rgba(34,212,122,0.14);
    --red:#ff4d4f;
    --red-dim:rgba(255,77,79,0.14);
    --gold:#f2b632;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    padding:16px 12px calc(env(safe-area-inset-bottom,0px) + 16px);
  }
  .app{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
    min-height:0;
  }

  .topbar{
    display:flex;
    gap:10px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
  }
  .portfolio{
    flex:1;
    min-width:0;
    padding:10px clamp(8px, 3vw, 14px);
  }
  .label{
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .portfolio .row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:4px;
  }
  .portfolio .value{
    font-size:clamp(1.05rem, 6vw, 1.35rem);
    font-weight:800;
    letter-spacing:-.01em;
  }
  .badge{
    font-family:inherit;
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px 9px;
    cursor:pointer;
  }
  .badge:active{transform:scale(.95);}

  .cashShares{
    flex:1.35;
    min-width:0;
    padding:10px clamp(8px, 3vw, 14px);
    display:flex;
    align-items:center;
  }
  .cashShares .col{flex:1;min-width:0;}
  .cashShares .col.right{flex:0 0 auto;text-align:right;}
  .cashShares .value{
    font-size:clamp(.74rem, 3.6vw, 1rem);
    font-weight:700;
    margin-top:4px;
    font-variant-numeric:tabular-nums;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cashShares .divider{
    width:1px;
    align-self:stretch;
    background:var(--border);
    margin:0 clamp(6px, 2.5vw, 12px);
  }

  .stockHeader{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:2px 2px 0;
  }
  .stockId{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.25rem;
    background:var(--gold);
    flex-shrink:0;
  }
  .stockName{font-weight:700;font-size:1rem;}
  .stockTicker{font-size:.78rem;color:var(--muted);margin-top:1px;}

  .priceBlock{text-align:right;}
  .live{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    font-size:.65rem;
    font-weight:700;
    letter-spacing:.1em;
    color:var(--muted);
  }
  .live .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(34,212,122,.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,212,122,.55);}
    70%{box-shadow:0 0 0 7px rgba(34,212,122,0);}
    100%{box-shadow:0 0 0 0 rgba(34,212,122,0);}
  }
  .price{
    font-size:1.65rem;
    font-weight:800;
    color:var(--green);
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .change{
    font-size:.82rem;
    font-weight:700;
    margin-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .change.up{color:var(--green);}
  .change.down{color:var(--red);}

  .chartWrap{
    flex:1;
    min-height:160px;
    border-radius:16px;
    overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.03), transparent 60%);
  }
  #chart{width:100%;height:100%;display:block;}

  .tabs{
    display:flex;
    gap:8px;
  }
  .tab{
    flex:1;
    min-width:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:9px 10px;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    color:var(--text);
  }
  .tab.selected{
    border-color:rgba(242,182,50,0.5);
    background:linear-gradient(180deg, rgba(242,182,50,0.1), rgba(242,182,50,0.03));
  }
  .tab.locked{
    cursor:default;
    opacity:.55;
  }
  .tab .tabTop{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tab .tabIcon{font-size:.9rem;}
  .tab .tabTicker{
    font-size:.78rem;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .tab.selected .tabTicker{color:var(--gold);}
  .tab .tabSub{
    font-size:.64rem;
    color:var(--muted);
    margin-top:4px;
    font-weight:600;
    letter-spacing:.02em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .actions{
    display:flex;
    gap:10px;
  }
  .actions button{
    flex:1;
    min-width:0;
    font-family:inherit;
    border:none;
    border-radius:16px;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    cursor:pointer;
  }
  .actions button:active{transform:scale(.98);}
  .buyBtn{
    flex:1.5;
    background:var(--green);
    color:#04240f;
  }
  .buyBtn .lbl{font-weight:800;font-size:.95rem;letter-spacing:.02em;}
  .buyBtn .sub{font-weight:600;font-size:.72rem;opacity:.75;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sellBtn{
    flex:1;
    background:var(--card2);
    color:var(--muted);
  }
  .sellBtn.active{
    background:var(--red);
    color:#2b0607;
  }
  .sellBtn .lbl{font-weight:800;font-size:.95rem;letter-spacing:.02em;}
  .sellBtn .sub{font-weight:600;font-size:.72rem;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sellBtn:disabled{cursor:default;}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="card portfolio">
      <div class="label">Portfolio</div>
      <div class="row">
        <span class="value" id="portfolioVal">$1K</span>
        <button class="badge" id="startBtn" title="Reset game">START</button>
      </div>
    </div>
    <div class="card cashShares">
      <div class="col">
        <div class="label">Cash</div>
        <div class="value" id="cashVal">$1,000.00</div>
      </div>
      <div class="divider"></div>
      <div class="col right">
        <div class="label">Shares</div>
        <div class="value" id="sharesVal">0</div>
      </div>
    </div>
  </div>

  <div class="stockHeader">
    <div class="stockId">
      <div class="avatar" id="avatarIcon">🐾</div>
      <div>
        <div class="stockName" id="stockName">MEOW Corp</div>
        <div class="stockTicker" id="stockTicker">MEOW</div>
      </div>
    </div>
    <div class="priceBlock">
      <div class="live"><span class="dot"></span>LIVE</div>
      <div class="price" id="priceVal">$0.00</div>
      <div class="change" id="changeVal">0.00%</div>
    </div>
  </div>

  <div class="card chartWrap">
    <canvas id="chart"></canvas>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="actions">
    <button class="buyBtn" id="buyBtn">
      <span class="lbl">BUY MAX</span>
      <span class="sub" id="buySub">0 shares</span>
    </button>
    <button class="sellBtn" id="sellBtn" disabled>
      <span class="lbl">SELL ALL</span>
      <span class="sub" id="sellSub">0 shares</span>
    </button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'stockTapState';

  const STOCKS = {
    MEOW: { name: 'MEOW Corp', ticker: 'MEOW', icon: '🐾', startPrice: 25, volatility: 0.35, unlockAt: 0 },
    BARK: { name: 'Bark Inc', ticker: 'BARK', icon: '🐕', startPrice: 8,  volatility: 0.55, unlockAt: 5000 },
    HOP:  { name: 'Hop Rocket', ticker: 'HOP', icon: '🚀', startPrice: 60, volatility: 0.85, unlockAt: 25000 }
  };
  const ORDER = ['MEOW', 'BARK', 'HOP'];
  const TICK_MS = 150;
  const WINDOW_MS = 10000;

  function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

  function fmtMoney(n){
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtCompact(n){
    if (n >= 1000000) return '$' + trimNum(n / 1000000) + 'M';
    if (n >= 1000) return '$' + trimNum(n / 1000) + 'K';
    return '$' + Math.round(n);
  }
  function trimNum(n){
    const r = Math.round(n * 10) / 10;
    return r % 1 === 0 ? String(r) : r.toFixed(1);
  }

  let sim = {};
  let cash = 1000;
  let holdings = { MEOW: 0, BARK: 0, HOP: 0 };
  let maxPortfolioValue = 1000;
  let selected = 'MEOW';

  function initSim(){
    ORDER.forEach((key) => {
      const s = STOCKS[key];
      sim[key] = {
        price: s.startPrice,
        openPrice: s.startPrice,
        trend: Math.random() < 0.5 ? 1 : -1,
        stepsLeft: 6 + Math.floor(Math.random() * 8),
        history: [{ t: performance.now(), price: s.startPrice }]
      };
    });
  }

  function loadState(){
    try{
      const raw = safeGet(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (typeof data.cash === 'number') cash = data.cash;
      if (data.holdings) holdings = Object.assign(holdings, data.holdings);
      if (typeof data.maxPortfolioValue === 'number') maxPortfolioValue = data.maxPortfolioValue;
    }catch(e){ /* ignore corrupt state */ }
  }
  function saveState(){
    safeSet(STORAGE_KEY, JSON.stringify({ cash, holdings, maxPortfolioValue }));
  }

  function resetGame(){
    cash = 1000;
    holdings = { MEOW: 0, BARK: 0, HOP: 0 };
    maxPortfolioValue = 1000;
    selected = 'MEOW';
    initSim();
    saveState();
    renderTabs();
    updateAll();
  }

  function isUnlocked(key){
    return STOCKS[key].unlockAt <= maxPortfolioValue;
  }

  function portfolioValue(){
    let v = cash;
    ORDER.forEach((key) => { v += holdings[key] * sim[key].price; });
    return v;
  }

  function simulateTick(){
    ORDER.forEach((key) => {
      const s = sim[key];
      const cfg = STOCKS[key];
      s.stepsLeft--;
      if (s.stepsLeft <= 0){
        s.trend *= -1;
        s.stepsLeft = 6 + Math.floor(Math.random() * 8);
      }
      const baseStep = cfg.startPrice * cfg.volatility * 0.012;
      s.price += s.trend * baseStep * (0.75 + Math.random() * 0.5);
      s.price = Math.max(0.5, s.price);
      const now = performance.now();
      s.history.push({ t: now, price: s.price });
      const cutoff = now - WINDOW_MS - 2000;
      while (s.history.length > 2 && s.history[0].t < cutoff) s.history.shift();
    });

    const pv = portfolioValue();
    if (pv > maxPortfolioValue) maxPortfolioValue = pv;
  }

  // ---- DOM refs ----
  const portfolioVal = document.getElementById('portfolioVal');
  const cashVal = document.getElementById('cashVal');
  const sharesVal = document.getElementById('sharesVal');
  const avatarIcon = document.getElementById('avatarIcon');
  const stockName = document.getElementById('stockName');
  const stockTicker = document.getElementById('stockTicker');
  const priceVal = document.getElementById('priceVal');
  const changeVal = document.getElementById('changeVal');
  const tabsEl = document.getElementById('tabs');
  const buyBtn = document.getElementById('buyBtn');
  const buySub = document.getElementById('buySub');
  const sellBtn = document.getElementById('sellBtn');
  const sellSub = document.getElementById('sellSub');
  const startBtn = document.getElementById('startBtn');
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');

  function renderTabs(){
    tabsEl.innerHTML = '';
    ORDER.forEach((key) => {
      const cfg = STOCKS[key];
      const unlocked = isUnlocked(key);
      const btn = document.createElement('button');
      btn.className = 'tab' + (key === selected ? ' selected' : '') + (!unlocked ? ' locked' : '');
      const sub = unlocked ? `${holdings[key]} HELD` : `LOCKED · ${fmtCompact(cfg.unlockAt)}`;
      btn.innerHTML = `
        <div class="tabTop">
          <span class="tabIcon">${unlocked ? cfg.icon : '🔒'}</span>
          <span class="tabTicker">${cfg.ticker}</span>
        </div>
        <div class="tabSub">${sub}</div>`;
      if (unlocked){
        btn.addEventListener('click', () => { selected = key; renderTabs(); updateAll(); });
      }
      tabsEl.appendChild(btn);
    });
  }

  function updateAll(){
    const s = sim[selected];
    const cfg = STOCKS[selected];

    portfolioVal.textContent = fmtCompact(portfolioValue());
    cashVal.textContent = fmtMoney(cash);
    sharesVal.textContent = holdings[selected];

    avatarIcon.textContent = cfg.icon;
    stockName.textContent = cfg.name;
    stockTicker.textContent = cfg.ticker;
    priceVal.textContent = fmtMoney(s.price);

    const changePct = ((s.price - s.openPrice) / s.openPrice) * 100;
    changeVal.textContent = (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%';
    changeVal.className = 'change ' + (changePct >= 0 ? 'up' : 'down');

    const affordable = Math.floor(cash / s.price);
    buySub.textContent = affordable + ' share' + (affordable === 1 ? '' : 's');
    buyBtn.disabled = affordable < 1;
    buyBtn.style.opacity = affordable < 1 ? 0.5 : 1;

    const held = holdings[selected];
    sellSub.textContent = held + ' share' + (held === 1 ? '' : 's');
    sellBtn.disabled = held < 1;
    sellBtn.classList.toggle('active', held >= 1);
  }

  buyBtn.addEventListener('click', () => {
    const s = sim[selected];
    const affordable = Math.floor(cash / s.price);
    if (affordable < 1) return;
    cash -= affordable * s.price;
    holdings[selected] += affordable;
    saveState();
    renderTabs();
    updateAll();
  });

  sellBtn.addEventListener('click', () => {
    const s = sim[selected];
    const held = holdings[selected];
    if (held < 1) return;
    cash += held * s.price;
    holdings[selected] = 0;
    saveState();
    renderTabs();
    updateAll();
  });

  startBtn.addEventListener('click', resetGame);

  // ---- chart rendering ----
  let viewW = 0, viewH = 0, DPR = 1;
  function resizeCanvas(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.parentElement.getBoundingClientRect();
    viewW = rect.width;
    viewH = rect.height;
    canvas.width = Math.round(viewW * DPR);
    canvas.height = Math.round(viewH * DPR);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);

  function drawChart(){
    ctx.clearRect(0, 0, viewW, viewH);

    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++){
      const y = (viewH / 4) * i;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(viewW, y);
      ctx.stroke();
    }

    const now = performance.now();
    const from = now - WINDOW_MS;
    const hist = sim[selected].history.filter(p => p.t >= from - 400);
    if (hist.length < 2) return;

    let min = Infinity, max = -Infinity;
    hist.forEach(p => { if (p.price < min) min = p.price; if (p.price > max) max = p.price; });
    if (min === max){ min -= 1; max += 1; }
    const pad = (max - min) * 0.18;
    min -= pad; max += pad;

    const toXY = (p) => {
      const x = ((p.t - from) / WINDOW_MS) * viewW;
      const y = viewH - ((p.price - min) / (max - min)) * viewH;
      return [x, y];
    };

    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (let i = 1; i < hist.length; i++){
      const [x0, y0] = toXY(hist[i - 1]);
      const [x1, y1] = toXY(hist[i]);
      ctx.strokeStyle = hist[i].price >= hist[i - 1].price ? '#22d47a' : '#ff4d4f';
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }

    const last = hist[hist.length - 1];
    const prev = hist[hist.length - 2];
    const [lx, ly] = toXY(last);
    ctx.beginPath();
    ctx.arc(lx, ly, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = last.price >= prev.price ? '#22d47a' : '#ff4d4f';
    ctx.fill();
  }

  let tickAcc = 0, lastFrame = null;
  function frame(t){
    if (lastFrame === null) lastFrame = t;
    tickAcc += t - lastFrame;
    lastFrame = t;
    while (tickAcc >= TICK_MS){
      simulateTick();
      tickAcc -= TICK_MS;
      updateAll();
    }
    drawChart();
    requestAnimationFrame(frame);
  }

  loadState();
  initSim();
  resizeCanvas();
  renderTabs();
  updateAll();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
