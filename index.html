<title>D&amp;A Gadgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0A0E16; --surface:#111726; --surface-2:#182238;
    --ink:#EDF2FB; --ink-dim:#93A0BA; --ink-faint:#5C6884;
    --line:rgba(237,242,251,0.10); --line-strong:rgba(237,242,251,0.20);
    --accent:#4C8DFF; --accent-ink:#08101F; --accent-soft:rgba(76,141,255,0.16);
    --gold:#F2A94E; --gold-soft:rgba(242,169,78,0.16);
    --shadow:0 24px 70px rgba(0,0,0,0.5);
    --font-display:'Unbounded',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#E4E9F2;
      --ink:#131A29; --ink-dim:#4B5670; --ink-faint:#8792A8;
      --line:rgba(19,26,41,0.10); --line-strong:rgba(19,26,41,0.20);
      --accent:#2C63D6; --accent-ink:#FFFFFF; --accent-soft:rgba(44,99,214,0.10);
      --gold:#B9700F; --gold-soft:rgba(185,112,15,0.12);
      --shadow:0 20px 50px rgba(19,26,41,0.12);
    }
  }
  :root[data-theme="light"]{
    --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#E4E9F2;
    --ink:#131A29; --ink-dim:#4B5670; --ink-faint:#8792A8;
    --line:rgba(19,26,41,0.10); --line-strong:rgba(19,26,41,0.20);
    --accent:#2C63D6; --accent-ink:#FFFFFF; --accent-soft:rgba(44,99,214,0.10);
    --gold:#B9700F; --gold-soft:rgba(185,112,15,0.12);
    --shadow:0 20px 50px rgba(19,26,41,0.12);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p,ul{margin:0;}
  ul{padding:0;list-style:none;}
  button{font-family:inherit;cursor:pointer;}

  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .glow-blob{
    position:absolute; width:min(72vmax,880px); height:min(72vmax,880px);
    border-radius:50%; left:0; top:0;
    background:radial-gradient(circle at 35% 35%, var(--accent-soft), transparent 68%);
    filter:blur(30px); view-transition-name:vt-glow;
    transition:none;
  }
  .glow-blob.gold{
    width:min(50vmax,620px); height:min(50vmax,620px);
    background:radial-gradient(circle at 40% 40%, var(--gold-soft), transparent 68%);
    view-transition-name:vt-glow2;
  }

  .app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;}

  .hud{
    display:flex; justify-content:space-between; align-items:center;
    padding:22px clamp(20px,4vw,56px) 16px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .hud-left{display:flex;align-items:center;gap:12px;}
  .mark{
    width:26px;height:26px;border-radius:7px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:900;font-size:.62rem;color:var(--accent-ink);
  }
  .brand{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;}

  .chip{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.07em;
    padding:7px 13px; border-radius:999px; white-space:nowrap;
  }
  .chip-kicker{
    view-transition-name:vt-kicker; color:var(--accent);
    border:1px solid var(--accent-soft); background:var(--accent-soft);
    text-transform:uppercase; font-weight:600;
  }
  .chip-index{
    view-transition-name:vt-index; color:var(--ink-dim);
    border:1px solid var(--line-strong); background:var(--surface);
    font-variant-numeric:tabular-nums;
  }

  .stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px clamp(20px,4vw,56px);overflow-y:auto;}
  .stage{width:100%;max-width:1180px;}

  .rail-wrap{
    display:flex;align-items:center;gap:22px;flex-shrink:0;
    padding:0 clamp(20px,4vw,56px) clamp(16px,3vh,26px);
    border-top:1px solid var(--line); padding-top:16px;
  }
  .rail{flex:1;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .tick{
    width:14px;height:5px;border-radius:3px;flex-shrink:0;border:none;
    background:var(--line-strong); padding:0; transition:width .25s ease,background .25s ease;
  }
  .tick.group-gap{margin-right:12px;}
  .tick[aria-current="true"]{width:30px;background:var(--accent);}
  .tick:hover{background:var(--ink-faint);}

  .controls{display:flex;gap:8px;flex-shrink:0;}
  .navbtn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); display:flex;align-items:center;justify-content:center;
  }
  .navbtn:hover{border-color:var(--accent);color:var(--accent);}
  .navbtn:disabled{opacity:.35;cursor:default;}
  .navbtn:focus-visible, .tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---- content primitives ---- */
  .kicker-line{
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.14em;
    font-size:.74rem; color:var(--accent); font-weight:600; margin-bottom:14px; display:block;
  }
  .slide-title{
    font-family:var(--font-display); font-weight:800; line-height:1.04; letter-spacing:-0.01em;
    text-wrap:balance; color:var(--ink); view-transition-name:vt-title;
  }
  .slide-title.xl{font-size:clamp(2.8rem,8vw,6.4rem);}
  .slide-title.lg{font-size:clamp(1.9rem,4.6vw,3.3rem);}
  .slide-title.md{font-size:clamp(1.55rem,3.2vw,2.3rem);}

  .lead{font-size:clamp(1rem,1.5vw,1.15rem);color:var(--ink-dim);max-width:64ch;line-height:1.6;margin-top:16px;}

  .points{display:flex;flex-direction:column;gap:12px;margin-top:22px;max-width:64ch;}
  .points li{padding-left:20px;position:relative;color:var(--ink-dim);line-height:1.55;font-size:.98rem;}
  .points li::before{content:'—';position:absolute;left:0;color:var(--accent);font-family:var(--font-mono);}

  .tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
  .tag{font-family:var(--font-mono);font-size:.78rem;padding:7px 13px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);}
  .tag.on{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:24px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:6px;}
  .stat-card .value{font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,2.8vw,2.15rem);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1;}
  .stat-card .slabel{font-weight:600;font-size:.94rem;}
  .stat-card .ssub{color:var(--ink-faint);font-size:.82rem;line-height:1.4;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:24px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;}
  .card h3{font-family:var(--font-mono);font-size:.88rem;font-weight:600;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
  .card p{color:var(--ink-dim);font-size:.9rem;line-height:1.55;}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;}
  @media (max-width:720px){.cols2{grid-template-columns:1fr;}}
  .colbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;}
  .colbox .clabel{font-family:var(--font-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:10px;display:block;}
  .colbox p{color:var(--ink-dim);font-size:.95rem;line-height:1.6;}
  .colbox ul{display:flex;flex-direction:column;gap:9px;}
  .colbox li{padding-left:18px;position:relative;color:var(--ink-dim);font-size:.9rem;line-height:1.5;}
  .colbox li::before{content:'—';position:absolute;left:0;color:var(--gold);font-family:var(--font-mono);}

  .bars{display:flex;flex-direction:column;gap:13px;margin-top:24px;}
  .bar-row{display:grid;grid-template-columns:112px 1fr 56px;align-items:center;gap:12px;}
  .bar-row .bname{font-size:.86rem;color:var(--ink-dim);}
  .bar-track{height:13px;background:var(--surface-2);border-radius:7px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--gold));}
  .bar-row .bnum{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-size:.86rem;}

  .table-wrap{overflow-x:auto;margin-top:24px;border:1px solid var(--line);border-radius:14px;}
  table.data-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:.86rem;min-width:460px;}
  .data-table th,.data-table td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  .data-table th{color:var(--ink-faint);font-weight:600;text-transform:uppercase;font-size:.68rem;letter-spacing:.08em;background:var(--surface);}
  .data-table td{color:var(--ink);font-variant-numeric:tabular-nums;}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tr.hl td{color:var(--accent);font-weight:600;}

  .process{display:flex;gap:0;flex-wrap:wrap;margin-top:26px;}
  .step{flex:1;min-width:120px;display:flex;flex-direction:column;gap:10px;position:relative;padding-right:14px;padding-bottom:10px;}
  .step .snum{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:.82rem;}
  .step:not(:last-child)::after{content:'';position:absolute;top:15px;left:44px;right:2px;height:1px;background:var(--line-strong);}
  .step .slabel{font-size:.84rem;color:var(--ink-dim);line-height:1.4;}

  .org{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:28px;}
  .org-node{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 20px;font-weight:600;font-size:.88rem;text-align:center;}
  .org-node.top{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .org-children{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;padding-top:20px;max-width:820px;}
  .org-children::before{content:'';position:absolute;top:0;left:50%;width:1px;height:20px;background:var(--line-strong);}

  .persona{display:flex;gap:24px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:22px;flex-wrap:wrap;}
  .persona-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:var(--accent-ink);font-size:1.25rem;flex-shrink:0;}
  .persona-body{flex:1;min-width:220px;}
  .persona-body h3{font-size:1.15rem;font-weight:700;}
  .persona-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-family:var(--font-mono);font-size:.78rem;color:var(--ink-faint);}
  .persona-body ul{margin-top:14px;display:flex;flex-direction:column;gap:7px;}
  .persona-body li{padding-left:18px;position:relative;color:var(--ink-dim);font-size:.88rem;}
  .persona-body li::before{content:'—';position:absolute;left:0;color:var(--accent);font-family:var(--font-mono);}
  .persona-behav{margin-top:14px;color:var(--ink-faint);font-size:.85rem;font-style:italic;}

  .verdict-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-family:var(--font-mono);font-weight:600;font-size:.82rem;margin-top:20px;}
  .credits{margin-top:28px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:28px;flex-wrap:wrap;}
  .credits .cname{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-dim);}
  .closing-line{margin-top:22px;font-family:var(--font-display);font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;color:var(--ink);}

  /* title slide */
  .title-slide .slide-title{margin-top:6px;}
  .title-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line);}
  .title-meta .tlabel{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);display:block;margin-bottom:5px;}
  .title-meta .tval{font-size:.92rem;color:var(--ink-dim);line-height:1.4;}

  /* agenda */
  .agenda-list{display:flex;flex-direction:column;margin-top:20px;}
  .agenda-item{display:grid;grid-template-columns:52px 1fr auto;gap:18px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);}
  .agenda-item:last-child{border-bottom:none;}
  .agenda-item .an{font-family:var(--font-display);font-weight:800;font-size:1.4rem;color:var(--ink-faint);}
  .agenda-item .aname{font-weight:600;font-size:1rem;}
  .agenda-item .adesc{color:var(--ink-faint);font-size:.82rem;margin-top:2px;}
  .agenda-item .arange{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*){animation:none !important;}
  }
  ::view-transition-group(*){animation-duration:520ms;animation-timing-function:cubic-bezier(.22,1,.36,1);}
  @keyframes fwd-out{to{transform:translateX(-2.4%);opacity:0;}}
  @keyframes fwd-in{from{transform:translateX(2.4%);opacity:0;}}
  @keyframes back-out{to{transform:translateX(2.4%);opacity:0;}}
  @keyframes back-in{from{transform:translateX(-2.4%);opacity:0;}}
  html.dir-fwd::view-transition-old(root){animation:420ms cubic-bezier(.22,1,.36,1) both fwd-out;}
  html.dir-fwd::view-transition-new(root){animation:460ms cubic-bezier(.22,1,.36,1) both fwd-in;}
  html.dir-back::view-transition-old(root){animation:420ms cubic-bezier(.22,1,.36,1) both back-out;}
  html.dir-back::view-transition-new(root){animation:460ms cubic-bezier(.22,1,.36,1) both back-in;}
</style>

<div class="glow" aria-hidden="true">
  <div class="glow-blob" id="glowBlob"></div>
  <div class="glow-blob gold" id="glowBlob2"></div>
</div>

<div class="app">
  <header class="hud">
    <div class="hud-left">
      <div class="mark">D&amp;A</div>
      <span class="brand">D&amp;A Gadgets — Business Plan</span>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="chip chip-kicker" id="hudKicker">Concept</div>
      <div class="chip chip-index" id="hudIndex">01 / 30</div>
    </div>
  </header>

  <div class="stage-wrap">
    <main class="stage" id="stage" aria-live="polite"></main>
  </div>

  <div class="rail-wrap">
    <div class="rail" id="rail"></div>
    <div class="controls">
      <button class="navbtn" id="prevBtn" aria-label="Previous slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="navbtn" id="nextBtn" aria-label="Next slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

  var CH = ["Concept", "Research & Market", "Product & Marketing", "Operations", "Financials & Outlook"];

  var slides = [
    { ch:0, kind:"title", kicker:"BUSINESS STARTUP PROJECT · PUFP LEVEL 5", title:"D&A Gadgets",
      subtitle:"A complete business plan for a mobile accessories store in Karachi, Pakistan.",
      meta:[["Submitted To","Sir Salahuddin"],["Submitted By","Ayan · Afnan · Danial"],
            ["Subject","Business Startup · Economics · Statistics · Business Mathematics"],
            ["Class / Date","PUFP Level 5 — 15 July 2026"]] },

    { ch:0, kind:"agenda", kicker:"ROADMAP", title:"What We'll Cover",
      items:[
        ["01","Concept & Opportunity","The idea, the market, the mission","Slides 3–9"],
        ["02","Research & Market Analysis","PESTLE, survey data, demand & supply","Slides 10–17"],
        ["03","Product & Marketing","Line-up, persona, mix, budget","Slides 18–22"],
        ["04","Operations","Supply chain, team, feasibility","Slides 23–25"],
        ["05","Financials & Outlook","Costs, break-even, financing, verdict","Slides 26–30"]
      ] },

    { ch:0, kind:"statement", kicker:"CH.01 · EXECUTIVE SUMMARY", title:"Genuine accessories, honest prices, one store.",
      lead:"D&A Gadgets is a retail store for smartphone accessories in Karachi — cases, chargers, earbuds, power banks and more — for every major brand, under one roof.",
      points:["Products for Samsung, Apple, Xiaomi, Oppo, Vivo, Realme, Infinix, Tecno & Google Pixel",
              "Built on genuine stock, fair pricing and real customer service",
              "Rides Pakistan's steady growth in smartphone ownership and accessory turnover"] },

    { ch:0, kind:"stat-grid", kicker:"CH.01 · TARGET MARKET", title:"Who We're Building For",
      stats:[["16–45","Age range","core smartphone-owning years"],
             ["7","Customer segments","students to small businesses"],
             ["Mid–Upper","Income tier","middle & upper-middle class"]],
      tags:["Students","Office Workers","Business Professionals","Gamers","Families","Online Shoppers","Small Businesses"] },

    { ch:0, kind:"dual", kicker:"CH.02 · BUSINESS OVERVIEW", title:"Vision & Mission",
      left:["Vision","To become one of the most trusted, customer-friendly mobile accessories stores in Karachi."],
      right:["Mission","Offer affordable, genuine accessories with reliable products, fair prices and a pleasant shopping experience."] },

    { ch:0, kind:"split-list", kicker:"CH.02 · OBJECTIVES", title:"Where We're Headed",
      left:["Short-Term",["Open the first store in Karachi","Build brand awareness","Reach PKR 2M monthly sales in Year 1","Grow a strong social media presence","Achieve high customer satisfaction"]],
      right:["Long-Term",["Open branches in major cities","Launch an online store","Introduce a loyalty program","Become a recognised national brand","Expand into wholesale distribution"]] },

    { ch:0, kind:"statement", kicker:"CH.02–03 · THE PROBLEM", title:"Karachi's accessory market has a trust gap.",
      lead:"Smartphones are now essential — but genuine accessories at fair prices are surprisingly hard to find.",
      points:["Many stores sell low-quality accessories that fail fast",
              "Others charge high prices for the same generic stock",
              "Recurring complaints: poor quality, high prices, limited variety, no warranty, poor service"] },

    { ch:0, kind:"cards", kicker:"CH.03 · IDEA GENERATION", title:"How We Landed on This Idea",
      cards:[["Brainstorming","Compared a coffee shop, clothing brand, cosmetics store and tuition academy against mobile accessories — accessories won on demand vs. investment."],
             ["Mind Mapping","Mapped products, customers, suppliers, pricing and operations to scope the business."],
             ["Observation","Field visits to Karachi's mobile markets confirmed steady demand and quality-conscious shoppers."],
             ["Pain Points","Poor quality, high prices, limited variety, no warranty, poor service — the gaps we're built to close."]] },

    { ch:0, kind:"stat-grid", kicker:"CH.03 · VALUE PROPOSITION", title:"Quality and Service, Under One Roof",
      lead:"Most competitors sell cheap. We sell genuine — at a competitive price, backed by real service.",
      tags:["Genuine products","Competitive prices","Wide accessory range","Knowledgeable staff","Attractive store layout","Strong social presence","Warranty on selected items"] },

    { ch:1, kind:"cards", kicker:"CH.04 · ENVIRONMENTAL SCAN", title:"PESTLE Analysis",
      cards:[["Political","Government support for SMEs and digital payments; import-policy shifts remain a watch-item."],
             ["Economic","Imported stock is exposed to exchange-rate swings — but accessories stay a near-essential purchase."],
             ["Social","Phones now run education, work and social life — accessory demand follows closely."],
             ["Technological","New phones every year force constant refreshes of cases, cables and chargers."],
             ["Legal","Registration, tax, consumer-protection and warranty compliance build customer trust."],
             ["Environmental","Less plastic packaging, reusable bags, and recycling damaged accessories where possible."]] },

    { ch:1, kind:"stat-grid", kicker:"CH.05 · MARKET RESEARCH", title:"How We Gathered the Evidence",
      stats:[["100","Survey respondents","Karachi, ages 16–45"],
             ["2","Data sources","primary survey + secondary reports"],
             ["Convenience","Sampling method","in-market approach"]],
      note:"Primary data: structured questionnaire, 100 respondents. Secondary data: Pakistan Bureau of Statistics and industry reports." },

    { ch:1, kind:"bars", kicker:"CH.06 · SURVEY RESULTS", title:"Who Answered the Survey",
      unit:"respondents", max:46,
      bars:[["Under 18",12],["18–25",46],["26–35",28],["Above 35",14]],
      note:"Gender split: 61% male, 39% female — of 100 respondents." },

    { ch:1, kind:"bars", kicker:"CH.06 · SURVEY RESULTS", title:"What They Buy Most",
      unit:"respondents", max:30,

    { ch:4, kind:"closing", kicker:"CH.20 · CONCLUSION", title:"Yes — this startup is built to succeed.",
      stats:[["PKR 4.8M","Initial investment"],["PKR 490K","Monthly profit"],["12–18 mo","To recover investment"],["≈122.5%","Return on investment"]],
      line:"“Quality Accessories. Smart Prices. Trusted Service.”",
      credits:["Ayan","Afnan","Danial"] }
  ];

  var TOTAL = slides.length;
  var groupEnd = {};
  (function(){
    var last = slides[0].ch;
    for (var i=0;i<slides.length;i++){
      if (slides[i].ch !== last){ groupEnd[i-1] = true; last = slides[i].ch; }
    }
  })();

  function chip(cls, text){ return '<span class="chip ' + cls + '">' + esc(text) + '</span>'; }

  function render(slide){
    var k = slide.kicker, t = slide.title;
    switch(slide.kind){

      case "title": {
        var meta = slide.meta.map(function(m){
          return '<div><span class="tlabel">'+esc(m[0])+'</span><div class="tval">'+esc(m[1])+'</div></div>';
        }).join("");
        return '<div class="title-slide">'
          + '<span class="kicker-line">'+esc(k)+'</span>'
          + '<h1 class="slide-title xl">'+esc(t)+'</h1>'
          + '<p class="lead" style="font-size:clamp(1.05rem,1.8vw,1.3rem);">'+esc(slide.subtitle)+'</p>'
          + '<div class="title-meta">'+meta+'</div>'
          + '</div>';
      }

      case "agenda": {
        var items = slide.items.map(function(it){
          return '<div class="agenda-item"><div class="an">'+esc(it[0])+'</div>'
            + '<div><div class="aname">'+esc(it[1])+'</div><div class="adesc">'+esc(it[2])+'</div></div>'
            + '<div class="arange">'+esc(it[3])+'</div></div>';
        }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="agenda-list">'+items+'</div>';
      }

      case "statement": {
        var pts = (slide.points||[]).map(function(p){ return '<li>'+esc(p)+'</li>'; }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<p class="lead">'+esc(slide.lead)+'</p>'
          + (pts ? '<ul class="points">'+pts+'</ul>' : '');
      }

      case "stat-grid": {
        var cards = (slide.stats||[]).map(function(s){
          return '<div class="stat-card"><div class="value">'+esc(s[0])+'</div><div class="slabel">'+esc(s[1])+'</div>'
            + (s[2] ? '<div class="ssub">'+esc(s[2])+'</div>' : '') + '</div>';
        }).join("");
        var tags = (slide.tags||[]).map(function(tg){ return '<span class="tag">'+esc(tg)+'</span>'; }).join("");
        var note = slide.note ? '<p class="lead" style="margin-top:20px;font-size:.88rem;">'+esc(slide.note)+'</p>' : '';
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + (slide.lead ? '<p class="lead">'+esc(slide.lead)+'</p>' : '')
          + (cards ? '<div class="grid">'+cards+'</div>' : '')
          + (tags ? '<div class="tagrow">'+tags+'</div>' : '') + note;
      }

      case "cards": {
        var cs = slide.cards.map(function(c){
          return '<div class="card"><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>';
        }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + (slide.lead ? '<p class="lead">'+esc(slide.lead)+'</p>' : '')
          + '<div class="cards">'+cs+'</div>';
      }

      case "cards-tags": {
        function grp(g){
          var tags = g[1].map(function(x){ return '<span class="tag on">'+esc(x)+'</span>'; }).join("");
          return '<div class="colbox"><span class="clabel">'+esc(g[0])+'</span><div class="tagrow" style="margin-top:0;">'+tags+'</div></div>';
        }
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<p class="lead">'+esc(slide.lead)+'</p>'
          + '<div class="cols2">'+grp(slide.groupA)+grp(slide.groupB)+'</div>';
      }

      case "dual": {
        function box(b){ return '<div class="colbox"><span class="clabel">'+esc(b[0])+'</span><p>'+esc(b[1])+'</p></div>'; }
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="cols2">'+box(slide.left)+box(slide.right)+'</div>';
      }

      case "split-list": {
        function box(b){
          var lis = b[1].map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("");
          return '<div class="colbox"><span class="clabel">'+esc(b[0])+'</span><ul>'+lis+'</ul></div>';
        }
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="cols2">'+box(slide.left)+box(slide.right)+'</div>';
      }

      case "bars": {
        var max = slide.max;
        var bars = slide.bars.map(function(b){
          var pct = Math.round((b[1]/max)*100);
          return '<div class="bar-row"><div class="bname">'+esc(b[0])+'</div>'
            + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div>'
            + '<div class="bnum">'+ (typeof b[1]==='number'? b[1].toLocaleString() : esc(b[1])) +'</div></div>';
        }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="bars">'+bars+'</div>'
          + (slide.note ? '<p class="lead" style="margin-top:20px;font-size:.88rem;">'+esc(slide.note)+'</p>' : '');
      }

      case "table": {
        var th = slide.cols.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join("");
        var rows = slide.rows.map(function(r,ri){
          var tds = r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join("");
          return '<tr'+(ri===slide.hlRow?' class="hl"':'')+'>'+tds+'</tr>';
        }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="table-wrap"><table class="data-table"><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
          + (slide.note ? '<p class="lead" style="margin-top:18px;font-size:.88rem;">'+esc(slide.note)+'</p>' : '');
      }

      case "table-stats": {
        var th2 = slide.cols.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join("");
        var rows2 = slide.rows.map(function(r){
          var tds = r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join("");
          return '<tr>'+tds+'</tr>';
        }).join("");
        var stats2 = slide.stats.map(function(s){
          return '<div class="stat-card"><div class="value">'+esc(s[0])+'</div><div class="slabel">'+esc(s[1])+'</div></div>';
        }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="table-wrap"><table class="data-table"><thead><tr>'+th2+'</tr></thead><tbody>'+rows2+'</tbody></table></div>'
          + '<div class="grid" style="margin-top:18px;">'+stats2+'</div>';
      }

      case "process": {
        var steps = slide.steps.map(function(s,i){
          return '<div class="step"><div class="snum">'+(i+1)+'</div><div class="slabel">'+esc(s)+'</div></div>';
        }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="process">'+steps+'</div>';
      }

      case "org": {
        var kids = slide.children.map(function(c){ return '<div class="org-node">'+esc(c)+'</div>'; }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="org"><div class="org-node top">'+esc(slide.top)+'</div>'
          + '<div class="org-node">'+esc(slide.mid)+'</div>'
          + '<div class="org-children">'+kids+'</div></div>'
          + (slide.note ? '<p class="lead" style="margin-top:18px;text-align:center;font-size:.88rem;">'+esc(slide.note)+'</p>' : '');
      }

      case "persona": {
        var needs = slide.needs.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="persona"><div class="persona-avatar">'+esc(slide.initials)+'</div>'
          + '<div class="persona-body"><h3>'+esc(slide.name)+'</h3>'
          + '<div class="persona-meta"><span>'+esc(slide.age)+'</span><span>'+esc(slide.role)+'</span><span>'+esc(slide.income)+'</span></div>'
          + '<ul>'+needs+'</ul>'
          + '<div class="persona-behav">'+esc(slide.behavior)+'</div></div></div>';
      }

      case "closing": {
        var stats3 = slide.stats.map(function(s){
          return '<div class="stat-card"><div class="value">'+esc(s[0])+'</div><div class="slabel">'+esc(s[1])+'</div></div>';
        }).join("");
        var cred = slide.credits.map(function(c){ return '<span class="cname">'+esc(c)+'</span>'; }).join("");
        return '<span class="kicker-line">'+esc(k)+'</span><h1 class="slide-title lg">'+esc(t)+'</h1>'
          + '<div class="grid">'+stats3+'</div>'
          + '<div class="verdict-badge">✓ Feasible across market, technical, operational & financial tests</div>'
          + '<div class="closing-line">'+esc(slide.line)+'</div>'
          + '<div class="credits">'+cred+'</div>';
      }
    }
    return "";
  }

  var stage = document.getElementById("stage");
  var hudKicker = document.getElementById("hudKicker");
  var hudIndex = document.getElementById("hudIndex");
  var railEl = document.getElementById("rail");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var glowBlob = document.getElementById("glowBlob");
  var glowBlob2 = document.getElementById("glowBlob2");

  var glowPos = [
    {x:"-14%", y:"-18%"}, {x:"64%", y:"-16%"}, {x:"70%", y:"66%"}, {x:"-10%", y:"64%"}, {x:"30%", y:"22%"}
  ];
  var glow2Pos = [
    {x:"58%", y:"58%"}, {x:"-6%", y:"56%"}, {x:"-8%", y:"-10%"}, {x:"66%", y:"-8%"}, {x:"55%", y:"-4%"}
  ];

  function pad2(n){ return n < 10 ? "0"+n : ""+n; }

  function placeGlow(index){
    var ch = slides[index].ch;
    var p1 = glowPos[ch % glowPos.length];
    var p2 = glow2Pos[ch % glow2Pos.length];
    var scale1 = 0.9 + ((index % 3) * 0.06);
    glowBlob.style.left = p1.x; glowBlob.style.top = p1.y;
    glowBlob.style.transform = "scale(" + scale1 + ")";
    glowBlob2.style.left = p2.x; glowBlob2.style.top = p2.y;
    glowBlob2.style.opacity = (ch === 4) ? "1" : "0.55";
  }

  function buildRail(){
    railEl.innerHTML = "";
    for (var i=0;i<TOTAL;i++){
      var b = document.createElement("button");
      b.className = "tick" + (groupEnd[i] ? " group-gap" : "");
      b.type = "button";
      b.setAttribute("aria-label", "Go to slide " + (i+1));
      b.dataset.i = i;
      b.addEventListener("click", function(){ go(parseInt(this.dataset.i,10)); });
      railEl.appendChild(b);
    }
  }

  var current = 0;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function paint(){
    var slide = slides[current];
    stage.innerHTML = render(slide);
    hudKicker.textContent = CH[slide.ch];
    hudIndex.textContent = pad2(current+1) + " / " + TOTAL;
    placeGlow(current);
    var ticks = railEl.children;
    for (var i=0;i<ticks.length;i++){
      ticks[i].removeAttribute("aria-current");
    }
    if (ticks[current]) ticks[current].setAttribute("aria-current","true");
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TOTAL - 1;
    stage.parentElement.scrollTop = 0;
  }

  function go(idx){
    if (idx < 0 || idx >= TOTAL || idx === current) return;
    var dir = idx > current ? "fwd" : "back";
    document.documentElement.classList.remove("dir-fwd","dir-back");
    document.documentElement.classList.add("dir-" + dir);
    current = idx;

    if (!reduceMotion && document.startViewTransition){
      document.startViewTransition(function(){ paint(); });
    } else {
      paint();
    }
  }

  prevBtn.addEventListener("click", function(){ go(current-1); });
  nextBtn.addEventListener("click", function(){ go(current+1); });

  window.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown"){ e.preventDefault(); go(current+1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); go(current-1); }
    else if (e.key === "Home"){ e.preventDefault(); go(0); }
    else if (e.key === "End"){ e.preventDefault(); go(TOTAL-1); }
  });

  var touchStartX = null;
  var stageWrap = document.querySelector(".stage-wrap");
  stageWrap.addEventListener("touchstart", function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
  stageWrap.addEventListener("touchend", function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50){ dx < 0 ? go(current+1) : go(current-1); }
    touchStartX = null;
  }, {passive:true});

  buildRail();
  paint();
})();
</script>
